version: "3.8"

services:
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    profiles: ["full"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    networks:
      - pi-otlp-net
    deploy:
      resources:
        limits:
          memory: ${OTELCOL_MEMORY_LIMIT:-160M}
    logging:
      driver: "k8s-file"
      options:
        max-size: "10m"
        max-file: "2"

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    restart: unless-stopped
    command:
      - "-storageDataPath=/vmdata"
      - "-retentionPeriod=${VM_RETENTION_PERIOD:-6}"
      - "-memory.allowedPercent=${VM_ALLOWED_PERCENT:-40}"
      - "-search.maxConcurrentRequests=${VM_MAX_CONCURRENT_REQUESTS:-2}"
      - "-insert.maxQueueDuration=1s"
      - "-opentelemetry.usePrometheusNaming=true"
    volumes:
      - vmdata:/vmdata
    ports:
      - "${VM_PORT:-8428}:8428"
    networks:
      - pi-otlp-net
    deploy:
      resources:
        limits:
          memory: ${VM_MEMORY_LIMIT:-96M}
    logging:
      driver: "k8s-file"
      options:
        max-size: "10m"
        max-file: "2"

  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: victorialogs
    restart: unless-stopped
    profiles: ["full"]
    command:
      - "-storageDataPath=/vldata"
      - "-retentionPeriod=${VL_RETENTION_PERIOD:-7d}"
      - "-memory.allowedPercent=${VL_ALLOWED_PERCENT:-20}"
    volumes:
      - vldata:/vldata
    ports:
      - "${VL_PORT:-9428}:9428"
    networks:
      - pi-otlp-net
    deploy:
      resources:
        limits:
          memory: ${VL_MEMORY_LIMIT:-128M}
    logging:
      driver: "k8s-file"
      options:
        max-size: "10m"
        max-file: "2"

  victoriatraces:
    image: victoriametrics/victoria-traces:latest
    container_name: victoriatraces
    restart: unless-stopped
    profiles: ["full"]
    command:
      - "-storageDataPath=/vtdata"
      - "-retentionPeriod=${VT_RETENTION_PERIOD:-7d}"
      - "-memory.allowedPercent=${VT_ALLOWED_PERCENT:-20}"
    volumes:
      - vtdata:/vtdata
    ports:
      - "${VT_PORT:-10428}:10428"
    networks:
      - pi-otlp-net
    deploy:
      resources:
        limits:
          memory: ${VT_MEMORY_LIMIT:-128M}
    logging:
      driver: "k8s-file"
      options:
        max-size: "10m"
        max-file: "2"

  grafana:
    image: docker.io/grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - victoriametrics
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - pi-otlp-net
    environment:
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_UNIFIED_ALERTING_ENABLED=${GRAFANA_ALERTING_ENABLED:-false}
      - GF_ALERTING_ENABLED=${GRAFANA_ALERTING_ENABLED:-false}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_CONNECTIONS_MAX=${GRAFANA_SERVER_CONNECTIONS_MAX:-10}
      - GF_INSTALL_PLUGINS=${GRAFANA_PLUGINS:-}
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-200M}
    logging:
      driver: "k8s-file"
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  vmdata:
  vldata:
  vtdata:
  grafanadata:

networks:
  pi-otlp-net:
    name: pi-otlp-net
